name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:extension
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "release/jspider-$GITHUB_REF_NAME.zip" --generate-notes --verify-tag
