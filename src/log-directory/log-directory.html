<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JSpider · Cartella log</title>
  <link rel="stylesheet" href="log-directory.css">
</head>
<body>
  <main>
    <span class="eyebrow">JSPIDER · LOG QUICK WORKFLOW</span>
    <h1>Autorizza la cartella log<span>.</span></h1>
    <label for="directory-path">Percorso configurato in config.local.json</label>
    <input id="directory-path" type="text" autocomplete="off" spellcheck="false" readonly placeholder="C:\Users\nome\JSpider\log">
    <p>Seleziona direttamente la cartella <code>log</code> indicata sopra. Non selezionare la cartella progetto JSpider.</p>
    <button id="confirm-existing-directory" class="secondary" type="button" hidden>Conferma cartella già autorizzata</button>
    <button id="choose-directory" type="button" disabled>Autorizza cartella log</button>
    <p id="directory-state" role="status">Caricamento configurazione…</p>
  </main>
  <script type="module" src="log-directory.js"></script>
</body>
</html>
